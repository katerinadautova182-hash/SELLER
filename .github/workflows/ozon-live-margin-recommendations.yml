name: Ozon Live Margin Recommendations

on:
  push:
    branches:
      - claude/ozon-seller-product-export-nubra0
    paths:
      - ".github/workflows/ozon-live-margin-recommendations.yml"
  workflow_dispatch:

jobs:
  live-margin:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          OZON_CLIENT_ID: test
          OZON_API_KEY: test
        run: pytest -q

      - name: Build live snapshot
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python -m ozon_agent.live_snapshot --output artifacts/ozon_catalog.json

      - name: Send actionable margin recommendations
        env:
          PURCHASE_COST_MAP_B64: ${{ secrets.PURCHASE_COST_MAP_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m ozon_agent.live_margin_recommendations --snapshot artifacts/ozon_catalog.json
