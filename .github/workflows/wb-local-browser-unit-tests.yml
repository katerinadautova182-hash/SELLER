name: WB local browser reader unit tests

on:
  push:
    paths:
      - wb_agent/browser_price_probe.py
      - tests/test_wb_browser_price_probe.py
      - .github/workflows/wb-local-browser-unit-tests.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pytest
      - name: Compile browser probe
        run: python -m py_compile wb_agent/browser_price_probe.py
      - name: Unit tests; no WB network
        run: python -m pytest -q tests/test_wb_browser_price_probe.py
