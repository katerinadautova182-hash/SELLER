name: Ozon Finance by SKU

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "Start date YYYY-MM-DD"
        required: true
        type: string
      date_to:
        description: "End date YYYY-MM-DD"
        required: true
        type: string

concurrency:
  group: ozon-finance-by-sku
  cancel-in-progress: false

jobs:
  finance-by-sku:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest -q

      - name: Validate Ozon secrets
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          missing=[k for k in ("OZON_CLIENT_ID","OZON_API_KEY") if not os.getenv(k)]
          if missing:
              print("Missing GitHub Secrets:", ", ".join(missing))
              sys.exit(2)
          PY

      - name: Build catalog snapshot for SKU mapping
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python -m ozon_agent.live_snapshot --output artifacts/ozon_catalog.json

      - name: Build realized finance by SKU
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python -m ozon_agent.finance_by_sku             --date-from "${{ inputs.date_from }}"             --date-to "${{ inputs.date_to }}"             --snapshot artifacts/ozon_catalog.json             --output-dir artifacts/finance

      - name: Upload finance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ozon-finance-by-sku
          path: |
            artifacts/finance/finance_by_sku.csv
            artifacts/finance/finance_non_item.csv
            artifacts/finance/finance_summary.json
            artifacts/finance/finance_by_sku.json
            artifacts/finance/finance_non_item.json
          if-no-files-found: error
          retention-days: 14
