name: WB Existing Key Permissions Check
on:
  workflow_dispatch:
  push:
    branches: [claude/ozon-seller-product-export-nubra0]
    paths: [".github/workflows/wb-key-permissions.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Test read-only WB access; do not disclose token
        env:
          WB_API_KEY: ${{ secrets.WB_API_KEY }}
        run: python -m wb_agent.key_permissions_probe
