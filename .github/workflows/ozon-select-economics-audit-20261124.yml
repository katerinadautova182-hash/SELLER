name: Ozon Select Economics Audit 2026-11-24 Encrypted
on:
  push:
    branches:
      - claude/ozon-seller-product-export-nubra0
    paths:
      - ".github/workflows/ozon-select-economics-audit-20261124.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests cryptography openpyxl
      - name: Collect Ozon realized finance and accruals read only, encrypt all outputs
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          PURCHASE_COST_MAP_B64: ${{ secrets.PURCHASE_COST_MAP_B64 }}
        run: python reporting/ozon_select_margin_probe_20261124.py
      - name: Upload encrypted report only
        uses: actions/upload-artifact@v4
        with:
          name: ozon-select-finance-encrypted-20261124
          path: artifacts/ozon_select_20261124_secure/
          retention-days: 2
          if-no-files-found: error
