name: Yandex one-off two-pass repricing
# Manual two-pass repricing requested 2026-10-13; runs only for explicitly approved push.

on:
  push:
    branches:
      - claude/ozon-seller-product-export-nubra0
    paths:
      - ".github/workflows/yandex-two-pass-reprice.yml"

permissions:
  contents: read

concurrency:
  group: yandex-price-correction
  cancel-in-progress: false

jobs:
  two-pass:
    if: ${{ github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'Run one-off two-pass Yandex repricing') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Validate Yandex pricing rules
        run: python -m pytest -q tests/test_yandex_one_shot.py tests/test_yandex_price_check.py tests/test_yandex_scheduled_control.py
      - name: Run exactly two repricing passes and verify
        env:
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          RRP_MAP_B64: ${{ secrets.RRP_MAP_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YANDEX_TWO_PASS_APPROVED: "YES"
        run: python -u -m yandex_agent.two_pass_reprice
      - name: Save audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yandex-two-pass-repricing
          path: artifacts/yandex-two-pass-reprice.json
          if-no-files-found: ignore
          retention-days: 30
