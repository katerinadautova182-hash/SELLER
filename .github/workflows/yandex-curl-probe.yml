name: Yandex curl_cffi storefront probe (5 cards)
# Recheck with optional session-cookie secret configured by repository owner.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ozon-seller-product-export-nubra0
    paths:
      - '.github/workflows/yandex-curl-probe.yml'
      - 'yandex_agent/curl_probe.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostic dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'curl-cffi>=0.7,<1'
      - name: Try five storefront cards (read only)
        env:
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_COOKIES_JSON: ${{ secrets.YANDEX_MARKET_COOKIES_JSON }}
          PYTHONPATH: ${{ github.workspace }}
        run: python -m yandex_agent.curl_probe --max-products 5
      - name: Save response diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yandex-curl-probe
          path: artifacts/yandex-curl-probe.json
          if-no-files-found: ignore
          retention-days: 7
