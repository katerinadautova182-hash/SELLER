name: JRL competitor price monitoring

on:
  schedule:
    # GitHub scheduled workflows can be delayed or dropped at the top of an hour.
    # 09:07 Moscow time: primary; 09:37: guarded fallback.
    - cron: "7 6 * * *"
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: jrl-competitor-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install requests beautifulsoup4 pytest
      - name: Test
        run: python -m pytest -q tests/test_competitor_monitor.py
      - name: Avoid duplicate delivery on fallback run
        id: delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          import requests

          should_run = True
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              try:
                  repo = os.environ["GITHUB_REPOSITORY"]
                  current_run = int(os.environ["GITHUB_RUN_ID"])
                  cutoff = datetime.now(timezone.utc).strftime("%Y-%m-%dT06:00:00Z")
                  url = f"https://api.github.com/repos/{repo}/actions/workflows/jrl-competitor-monitor.yml/runs"
                  response = requests.get(
                      url,
                      params={"event": "schedule", "per_page": 30},
                      headers={
                          "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                      timeout=25,
                  )
                  response.raise_for_status()
                  runs = response.json()["workflow_runs"]
                  previous = [
                      run for run in runs
                      if int(run["id"]) != current_run
                      and run.get("conclusion") == "success"
                      and run.get("created_at", "") >= cutoff
                  ]
                  if previous:
                      print("Successful daily report already delivered; skipping duplicate.")
                      should_run = False
              except Exception as exc:
                  print(f"Duplicate-check unavailable; delivering report: {type(exc).__name__}: {exc}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"send={'true' if should_run else 'false'}\n")
          PY
      - name: Validate Telegram credentials
        if: steps.delivery.outputs.send == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
            exit 1
          fi
      - name: Check eight sites and send Telegram message per site
        if: steps.delivery.outputs.send == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m competitor_monitor.monitor
      - name: Alert in Telegram when daily monitoring fails
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from ozon_agent.telegram import send_telegram
          from os import environ
          try:
              send_telegram(
                  "JRL: ежедневный мониторинг цен НЕ ВЫПОЛНЕН. "
                  "Проверьте журнал GitHub Actions: "
                  f"https://github.com/{environ['GITHUB_REPOSITORY']}/actions/runs/{environ['GITHUB_RUN_ID']}"
              )
          except Exception as exc:
              print(f"Failed to send Telegram failure alert: {type(exc).__name__}")
          PY
      - name: Save details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrl-competitor-price-audit
          path: artifacts/jrl-competitors/
          if-no-files-found: ignore
          retention-days: 30
