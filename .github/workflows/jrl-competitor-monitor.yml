name: JRL competitor price monitoring
on:
  schedule:
    # Every day at 09:00 Moscow time (UTC+3)
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - feature/jrl-competitor-detailed-report-2026-10-23
    paths:
      - ".github/workflows/jrl-competitor-monitor.yml"
      - "competitor_monitor/**"
      - "tests/test_competitor_monitor.py"

permissions:
  contents: read

concurrency:
  group: jrl-competitor-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install requests beautifulsoup4 pytest
      - name: Test
        run: python -m pytest -q tests/test_competitor_monitor.py
      - name: Verify all 219 official JRL RRP prices
        run: python -c "from competitor_monitor.monitor import load_rrp; load_rrp(); print('219 цен JRL соответствуют прайсу')"
      - name: Check sites and send one Telegram message per site
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m competitor_monitor.monitor
      - name: Read public catalogues without notifications
        if: github.event_name == 'push'
        run: python -m competitor_monitor.monitor --no-telegram --max-products 8 --delay 0.2
      - name: Save details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrl-competitor-price-audit
          path: artifacts/jrl-competitors/
          if-no-files-found: ignore
          retention-days: 30
