name: Ozon Margin Check

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ozon-seller-product-export-nubra0
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: ozon-margin-check
  cancel-in-progress: false

jobs:
  margin-check:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest -q

      - name: Validate Ozon secrets
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          missing=[k for k in ("OZON_CLIENT_ID","OZON_API_KEY") if not os.getenv(k)]
          if missing:
              print("Missing GitHub Secrets:", ", ".join(missing))
              sys.exit(2)
          print("Ozon credentials are configured.")
          PY

      - name: Ozon API smoke test
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python -m ozon_agent.smoke_test

      - name: Ozon finance accrual smoke test
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python -m ozon_agent.finance_smoke

      - name: Build live Ozon catalog snapshot
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python -m ozon_agent.live_snapshot --output artifacts/ozon_catalog.json

      - name: Restore price alert state
        uses: actions/cache@v4
        with:
          path: .state
          key: ozon-price-alert-${{ github.run_id }}
          restore-keys: |
            ozon-price-alert-

      - name: Send changed price violations to Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RRP_MAP_B64: ${{ secrets.RRP_MAP_B64 }}
        run: python -m ozon_agent.price_alert --snapshot artifacts/ozon_catalog.json

      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ozon-margin-diagnostics
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
