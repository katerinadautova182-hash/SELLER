name: Ozon Margin Check

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ozon-seller-product-export-nubra0
  schedule:
    - cron: "17 5 * * *"

jobs:
  margin-check:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest -q

      - name: Validate Ozon secrets
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          missing=[k for k in ("OZON_CLIENT_ID","OZON_API_KEY") if not os.getenv(k)]
          if missing:
              print("Missing GitHub Secrets:", ", ".join(missing))
              sys.exit(2)
          print("Ozon credentials are configured.")
          PY

      - name: Ozon API smoke test
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python -m ozon_agent.smoke_test

      - name: Build live Ozon catalog snapshot
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python -m ozon_agent.live_snapshot --output artifacts/ozon_catalog.json

      - name: Telegram notification
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from ozon_agent.telegram import send_telegram
          if os.getenv("TELEGRAM_BOT_TOKEN") and os.getenv("TELEGRAM_CHAT_ID"):
              send_telegram("Ozon agent: проверка выполнена. Подробные текстовые рекомендации будут подключены после финансовой сверки.")
          else:
              print("Telegram secrets are not configured; skipping.")
          PY

      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ozon-margin-diagnostics
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
