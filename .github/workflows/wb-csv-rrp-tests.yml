name: WB CSV buyer price RRP dry-run tests
on:
  push:
    paths:
      - "wb_agent/csv_rrp_control.py"
      - "tests/test_wb_csv_rrp_control.py"
      - ".github/workflows/wb-csv-rrp-tests.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile wb_agent/csv_rrp_control.py
      - name: Verify RRP and active promo pricing rules
        run: python -m pytest -q tests/test_wb_csv_rrp_control.py
