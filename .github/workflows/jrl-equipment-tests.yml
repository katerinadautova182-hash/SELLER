name: JRL equipment monitor regression

on:
  push:
    branches:
      - "fix/jrl-equipment-only-*"
  pull_request:
    paths:
      - "competitor_monitor/**"
      - "tests/test_competitor_monitor.py"
      - ".github/workflows/jrl-equipment-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equipment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install requests beautifulsoup4 pytest
      - name: Regression tests
        run: python -m pytest -q tests/test_competitor_monitor.py
      - name: Live BarberKit dryer audit (no Telegram)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from competitor_monitor.monitor import load_rrp, scan_site
          config = json.loads(Path("competitor_monitor/sites.json").read_text(encoding="utf-8"))
          barberkit = next(site for site in config["sites"] if "barberkit.ru" in site["url"])
          barberkit["max_product_pages"] = 25
          report = scan_site(barberkit, load_rrp(), delay=0)
          print("BarberKit pages:", report["pages_ok"], "/", report["pages_attempted"])
          print("BarberKit confirmed devices:", len(report["items"]))
          print("BarberKit errors:", json.dumps(report["errors"], ensure_ascii=False))
          for row in report["items"]:
              print(f"{row['sku']} | {row['price']} / {row['rrp']} | {row['url']} | {row['name']}")
          have = {row["sku"] for row in report["items"]}
          assert {"FP2401B", "FP2401-W", "FP2401HD"} <= have, (
              "One or more BarberKit Forte Pro dryer colour variants were missed"
          )
          assert not any(row["sku"].replace(" ", "") in ("BF03", "SF11", "BR132MM", "J302RED")
                         for row in report["items"]), "Accessory SKU leaked into the report"
          PY
