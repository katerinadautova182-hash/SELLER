name: JRL Pro one-off HTTP check
on:
  push:
    branches:
      - claude/ozon-seller-product-export-nubra0
    paths:
      - ".github/workflows/jrl-pro-one-off-diagnostic.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check availability with monitor user agent
        run: |
          python - <<'PY'
          import requests
          url = 'https://jrl-pro.ru/'
          try:
              response = requests.get(url, headers={"User-Agent":"Mozilla/5.0 (compatible; JRLPriceAudit/1.0; +public-price-monitor)", "Accept-Language":"ru-RU,ru;q=0.9"},timeout=(5,9))
              print("URL:",response.url,"STATUS:",response.status_code,"BYTES:",len(response.content),"CONTENT-TYPE:",response.headers.get("Content-Type"),flush=True)
              print("PAGE-TITLE:",response.text[:250].replace("\n"," "),flush=True)
          except Exception as exc:
              print("ERROR:",type(exc).__name__,str(exc)[:400],flush=True)
          PY
