name: WB daily GitHub correction unit tests
on:
  push:
    paths:
      - "wb_agent/github_daily_correction.py"
      - "wb_agent/first_pass_controller.py"
      - "tests/test_wb_github_daily_correction.py"
      - ".github/workflows/wb-daily-correction-tests.yml"
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pytest
      - run: python -m py_compile wb_agent/github_daily_correction.py
      - run: python -m pytest -q tests/test_wb_github_daily_correction.py tests/test_wb_first_pass_controller.py tests/test_wb_csv_rrp_control.py
