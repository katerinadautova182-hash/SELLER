name: WB alternative price endpoints probe

on:
  push:
    paths:
      - .github/workflows/wb-price-endpoints-probe.yml

permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe public card and search endpoints, Moscow 1308438233 (read only)
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error, json, ssl
          id="1308438233"
          param="appType=1&curr=rub&lang=ru&dest=-1257786&nm="+id
          urls={
              "card v4 spp30":"https://card.wb.ru/cards/v4/detail?"+param+"&spp=30",
              "search host cards v4":"https://search.wb.ru/cards/v4/detail?"+param,
              "u-card cards v4":"https://u-card.wb.ru/cards/v4/detail?"+param,
              "search v9":"https://search.wb.ru/exactmatch/ru/common/v9/search?appType=1&curr=rub&dest=-1257786&query="+id+"&resultset=catalog&sort=popular",
              "search v13":"https://search.wb.ru/exactmatch/ru/common/v13/search?appType=1&curr=rub&dest=-1257786&query="+id+"&resultset=catalog&sort=popular",
              "wildberries html":"https://www.wildberries.ru/catalog/"+id+"/detail.aspx",
          }
          for name,url in urls.items():
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36","Accept":"application/json, text/plain, */*","Accept-Language":"ru-RU,ru;q=0.9","Referer":"https://www.wildberries.ru/"})
                  with urllib.request.urlopen(req,timeout=12) as r:
                      body=r.read(12000).decode("utf-8","replace")
                      print("ENDPOINT",name,"HTTP",r.status,"TYPE",r.headers.get("Content-Type"),"BODY",body[:500].replace("\\n"," "),flush=True)
                      try:
                          data=json.loads(body)
                          products=data.get("products") or (data.get("data") or {}).get("products") or []
                          if isinstance(products,list) and products:
                              for product in products[:3]:
                                  print("PRODUCT",name,json.dumps({"id":product.get("id"),"salePriceU":product.get("salePriceU"),"priceU":product.get("priceU"),"sizes":product.get("sizes",[])[:2]},ensure_ascii=False)[:2500],flush=True)
                      except Exception:
                          pass
              except urllib.error.HTTPError as e:
                  print("ENDPOINT",name,"HTTP",e.code,"BODY",e.read(400).decode("utf-8","replace").replace("\\n"," "),flush=True)
              except Exception as e:
                  print("ENDPOINT",name,"ERROR",type(e).__name__,str(e)[:300],flush=True)
          PY
