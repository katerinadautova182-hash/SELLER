name: October 2026 SKU quantity export (read-only)
on:
  push:
    paths:
      - "reporting/october_2026_sales.py"
      - ".github/workflows/october-2026-sales.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  october:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch October marketplace sales
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_KEY: ${{ secrets.WB_API_KEY }}
          WB_STATISTICS_API_KEY: ${{ secrets.WB_STATISTICS_API_KEY }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
        run: python reporting/october_2026_sales.py
      - name: Preserve raw evidence and CSV even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: october-2026-marketplace-sales
          path: artifacts/october_2026/
          retention-days: 30
          if-no-files-found: warn
