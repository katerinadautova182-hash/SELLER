name: October realization reports - accounting basis
on:
  push:
    paths:
      - reporting/october_2026_realized.py
      - .github/workflows/october-2026-realized.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accounting-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch realization reports
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_KEY: ${{ secrets.WB_API_KEY }}
          WB_STATISTICS_API_KEY: ${{ secrets.WB_STATISTICS_API_KEY }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
        run: python reporting/october_2026_realized.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: october-2026-REALIZATION
          path: artifacts/october_2026_realized/
          if-no-files-found: warn
          retention-days: 30
