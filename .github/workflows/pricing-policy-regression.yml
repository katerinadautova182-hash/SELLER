name: Ozon and Yandex pricing policy regression

on:
  push:
    branches:
      - chatgpt/promo-dec15-rrp-plus-200-500-20261123
    paths:
      - "ozon_agent/**"
      - "yandex_agent/**"
      - "tests/**"
      - ".github/workflows/pricing-policy-regression.yml"
  pull_request:
    paths:
      - "ozon_agent/**"
      - "yandex_agent/**"
      - "tests/**"
      - ".github/workflows/pricing-policy-regression.yml"

permissions:
  contents: read

jobs:
  pricing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile pricing modules
        run: python -m compileall -q ozon_agent yandex_agent
      - name: Regression tests
        env:
          OZON_CLIENT_ID: test
          OZON_API_KEY: test
        run: >-
          python -m pytest -q
          tests/test_pricing_policy.py
          tests/test_promo_policy.py
          tests/test_ozon_economics.py
          tests/test_price_alert.py
          tests/test_auto_fix_yellow.py
          tests/test_yandex_price_check.py
          tests/test_yandex_one_shot.py
          tests/test_yandex_scheduled_control.py
          tests/test_yandex_reporting.py
          tests/test_yandex_repeat.py
          tests/test_yandex_official_prices.py
