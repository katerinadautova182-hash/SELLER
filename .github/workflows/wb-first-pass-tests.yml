name: WB first-pass safe correction tests
on:
  push:
    paths:
      - wb_agent/first_pass_controller.py
      - wb_agent/csv_rrp_control.py
      - tests/test_wb_first_pass_controller.py
      - tests/test_wb_csv_rrp_control.py
      - .github/workflows/wb-first-pass-tests.yml
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Compile price controller
        run: |
          python -m py_compile wb_agent/first_pass_controller.py
          python -m py_compile wb_agent/csv_rrp_control.py
      - name: Test correction rules without WB API writes
        run: python -m pytest -q tests/test_wb_first_pass_controller.py tests/test_wb_csv_rrp_control.py
