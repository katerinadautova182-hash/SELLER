name: Yandex Market Pay Price Check (Read Only)

on:
  workflow_dispatch:

concurrency:
  group: yandex-pay-price-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Test Yandex Pay storefront parser
        run: python -m pytest -q tests/test_yandex_price_check.py

      - name: Check required secrets
        env:
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          RRP_MAP_B64: ${{ secrets.RRP_MAP_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, sys
          keys = [
              "YANDEX_MARKET_API_KEY",
              "RRP_MAP_B64",
              "TELEGRAM_BOT_TOKEN",
              "TELEGRAM_CHAT_ID",
          ]
          missing = [key for key in keys if not os.getenv(key)]
          if missing:
              print("Missing secrets: " + ", ".join(missing))
              sys.exit(2)
          print("Yandex Market and Telegram credentials are configured.")
          PY

      - name: Read final public Yandex Pay prices
        env:
          PYTHONPATH: ${{ github.workspace }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          RRP_MAP_B64: ${{ secrets.RRP_MAP_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YANDEX_MARKET_REGION_ID: "213"
        run: |
          python -m compileall -q yandex_agent
          python -m yandex_agent.price_check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yandex-pay-price-audit
          path: artifacts/yandex-pay-price-audit.json
          if-no-files-found: ignore
          retention-days: 14
