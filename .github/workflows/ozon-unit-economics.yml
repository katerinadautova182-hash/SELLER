name: Ozon Unit Economics Check

on:
  workflow_dispatch:

concurrency:
  group: ozon-unit-economics
  cancel-in-progress: false

jobs:
  unit-economics:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest -q

      - name: Validate required secrets
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          PURCHASE_COST_MAP_B64: ${{ secrets.PURCHASE_COST_MAP_B64 }}
        run: |
          python - <<'PY'
          import os, sys
          missing=[k for k in ("OZON_CLIENT_ID","OZON_API_KEY","PURCHASE_COST_MAP_B64") if not os.getenv(k)]
          if missing:
              print("Missing GitHub Secrets:", ", ".join(missing))
              sys.exit(2)
          print("Required secrets are configured.")
          PY

      - name: Build live Ozon catalog snapshot
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python -m ozon_agent.live_snapshot --output artifacts/ozon_catalog.json

      - name: Build live unit economics
        env:
          PURCHASE_COST_MAP_B64: ${{ secrets.PURCHASE_COST_MAP_B64 }}
        run: python -m ozon_agent.unit_economics_live --snapshot artifacts/ozon_catalog.json

      - name: Upload unit economics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ozon-unit-economics
          path: |
            artifacts/unit_economics_live.json
            artifacts/unit_economics_live.csv
            artifacts/ozon_catalog.json
          if-no-files-found: error
          retention-days: 14
