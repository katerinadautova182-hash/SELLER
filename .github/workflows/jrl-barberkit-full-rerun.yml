name: JRL BarberKit + Shevelura full catalog audit
on:
  push:
    branches:
      - feature/jrl-exhaustive-crawl-and-strict-types-20261026
    paths:
      - ".github/workflows/jrl-barberkit-full-rerun.yml"
      - "tests/test_competitor_monitor.py"
      - "competitor_monitor/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jrl-barberkit-shevelura-manual-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: barberkit.ru
            slug: barberkit
          - site: shevelura23.ru
            slug: shevelura23
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install requests beautifulsoup4 pytest
      - name: Strict type and pagination tests
        run: python -m pytest -q tests/test_competitor_monitor.py
      - name: Crawl all discoverable products for ${{ matrix.site }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m competitor_monitor.monitor --site "${{ matrix.site }}" --delay 0.12 --out "artifacts/${{ matrix.slug }}"
      - name: Send full prices TXT to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_SLUG: ${{ matrix.slug }}
          TARGET_SITE: ${{ matrix.site }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from ozon_agent.telegram import send_telegram_document
          slug = os.environ["TARGET_SLUG"]
          site = os.environ["TARGET_SITE"]
          path = Path(f"artifacts/{slug}/{slug}.txt")
          if path.is_file() and path.stat().st_size:
              assert send_telegram_document(
                  path, caption=f"{site} — полный отчёт: все найденные цены JRL, РРЦ и разница. "
                  "Покрытие может быть неполным — см. статус в отчёте."
              )
              print(f"TELEGRAM_FULL_DOCUMENT_SENT {site}", flush=True)
          else:
              print(f"Telegram full report unavailable for {site}: no TXT artifact.")
              raise SystemExit(1)
          PY
      - name: Full audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "jrl-${{ matrix.slug }}-full-audit"
          path: "artifacts/${{ matrix.slug }}/"
          if-no-files-found: ignore
          retention-days: 30
