name: WB Buyer Price Control Probe
on:
  push:
    branches:
      - claude/ozon-seller-product-export-nubra0
    paths:
      - "wb_agent/buyer_price_probe.py"
      - ".github/workflows/wb-buyer-price-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe WB card prices (Moscow)
        run: python -m wb_agent.buyer_price_probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wb-two-control-prices
          path: wb-control-prices.json
          if-no-files-found: ignore
