name: Ozon Sales Decline Investigation 2026-11-24 (Encrypted)
on:
  push:
    branches:
      - claude/ozon-seller-product-export-nubra0
    paths:
      - ".github/workflows/ozon-decline-investigation-20261124.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests cryptography
      - name: Read only Seller API collection with encrypted output
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          OZON_PERFORMANCE_CLIENT_ID: ${{ secrets.OZON_PERFORMANCE_CLIENT_ID }}
          OZON_PERFORMANCE_CLIENT_SECRET: ${{ secrets.OZON_PERFORMANCE_CLIENT_SECRET }}
        run: python reporting/ozon_decline_probe_20261124.py
      - name: Upload encrypted report only
        uses: actions/upload-artifact@v4
        with:
          name: ozon-decline-encrypted-20261124
          path: artifacts/ozon_decline_20261124_secure/
          retention-days: 2
          if-no-files-found: error
